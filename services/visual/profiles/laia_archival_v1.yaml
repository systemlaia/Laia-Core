name: laia_archival_v1
description: Archival documentation, clean composition, realistic materials.

workflow: api/flux_text_to_image_api.json

checkpoint: juggernautXL.safetensors

positive:
  - archival photography
  - technical documentation
  - cinematic realism
  - structured composition
  - accurate materials
  - clean lighting

negative:
  - blurry
  - watermark
  - warped geometry
  - fake text
  - extra limbs
  - distorted perspective

outputs:
  folder: services/visual/outputs
  prefix: laia_archival
